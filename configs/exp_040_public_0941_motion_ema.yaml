schema_version: 1
experiment_id: exp_040_public_0941_motion_ema
parent: val_039_public_0941_train16
hypothesis: >
  Replacing only the motion-relink one-frame velocity estimate with the previously reproduced
  per-track EMA at alpha 0.4 will improve the frozen public-0.941 train16 score by at least 0.001
  without a material adjusted-edge regression in either specimen or degradation of division counts.
change:
  component: motion_relink_velocity_estimator
  from: Latest one-frame displacement with velocity multiplier 0.5
  to: Per-track exponential moving average with alpha 0.4 and unchanged velocity multiplier 0.5
  variables_changed: motion_relink_velocity_estimator_only
source_notebook: .private/current/public_0941_motion_ema.ipynb
validation:
  protocol: public_0941_frozen_train16_stratified_proxy_v1
  primary_metric: score
  seed: public_0933_train16_v1
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  division_positive_target_per_specimen: 4
  sample_and_scorer_reference: val_039_public_0941_train16
  adjusted_edge_material_regression_tolerance: 0.002
  division_count_gates: {minimum_tp: 4, maximum_fp: 9, maximum_fn: 8}
  warning: Frozen models saw training videos; this is an optimistic paired screening proxy, not held-out model generalization.
budget:
  tier: 1
  expected_gpu_hours: 2.0
success:
  minimum_improvement: 0.001
  regression_threshold: 0.0
  per_specimen_max_regression: 0.002
evaluation:
  mode: gate
  gate_field: ema_candidate_gate_passed
admission:
  require_claude_review: true
  methodology_valid: true
  require_reproducible_for_promotion: true
local:

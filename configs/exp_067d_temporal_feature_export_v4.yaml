schema_version: 1
experiment_id: exp_067d_temporal_feature_export_v4
parent: exp_064_x138_verbatim_repro
hypothesis: The frozen exp064 predictor can export measured temporal features and
  bounded top-k alternatives ranked by logits, mapped to its unchanged final graph
  on explicit TRAIN movies, enabling the agreed learned joint-lineage model.
change:
  component: measured_temporal_feature_export_v4
  exact: 'Add export hooks and identity metadata; run eight fixed TRAIN movies. Assert
    the resolved parent globals and the effective predictor argv against the frozen
    exp064 configuration before inference, allowing only the declared validator-enable
    difference; persist observed dependency hashes and package versions in metrics.
    No repeated detector inference, TEST prediction, sweep or trained head yet. v4
    fixes the exp067c v1 gate defect: the stray-key allow-list is built from EVERY
    environment key the parent assigns, not from the value-asserted subset, so the
    wall-clock key the parent legitimately sets is no longer rejected as unexpected.
    No other change.'
source_notebook: experiments/exp_067_temporal_joint_lineage/local_build/export_v4.ipynb
strategy_record: experiments/exp_067_temporal_joint_lineage/remote_trial_amendment_v3.md
execution_authorization: 'User 2026-09-26 explicitly requested a direct Kaggle trial
  after code completion. This first run produces the data required to train the new
  head. The launch still goes through the controller gates: fresh admission review,
  snapshot smoke and an explicit budget reservation.'
validation:
  protocol: exp067_train_export_v1
  primary_metric: binary_export_integrity
  split_protocol: within_prefix_movie_holdout
  split_protocol_note: 'Fixed within-prefix movie holdout: six TRAIN movies fit the
    new head, two are held out, both prefixes present on each side. This is NOT leave-one-movie-out
    cross-validation and NOT a cross-domain split; the 44b6 and 6bba domains both
    appear in training, so it cannot establish cross-domain generalization.'
  limitations: Engineering export gate only; no gain claim. Eight movies inherited
    from prior diagnostic coverage (historically label-enriched), split within prefix
    before new-head training. Later scores from this split are a biased local proxy,
    not pristine validation, and cannot show cross-domain generalization. Frozen backbone
    overlap unknown. Representative parent parity reuses the instrumented raw graphs,
    so it evidences postprocessing preservation only, not detector or association
    equivalence.
admission:
  require_codex_review: true
  reviewer_provider: codex
local:
  smoke_test:
  - '{python}'
  - scripts/validate_notebook.py
  - '{source_notebook}'
  - --require-metrics-contract
budget:
  tier: 1
  expected_gpu_hours: 2.0
  note: One attempt. PLANNED allocation of 2.0 GPU hours; the controller reserves
    it at the launch gate and this config does not claim it is already reserved. The
    notebook watchdog kills descendant predictor processes and exits 5400 seconds
    after cell0; the 2 h figure includes startup margin. No automatic retries. Only
    the export executes; the pinned parent CUDA image is retained and the separate
    CPU training requirements are not installed into it.
success:

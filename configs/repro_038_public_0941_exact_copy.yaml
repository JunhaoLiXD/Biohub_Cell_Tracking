  warning: >
    The user explicitly requested one direct public copy and leaderboard submission
    before controlled reproduction. Retain the original division-first four-video
    validator unchanged. Its scores are not comparable with our frozen train16
    scores. No baseline promotion and no inference changes are authorized here.
budget:

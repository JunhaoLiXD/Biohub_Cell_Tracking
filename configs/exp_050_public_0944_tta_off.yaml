  parent_score: 0.9310696298996892
  hypothesis_direction: A is a matched attribution control; report B-A in either direction
  next_arm_gate: If B-A is negative and no independent rescue mechanism is established, stop composition. No automatic C/D launch.
  advancement_gate: Candidates considered for future independent reproduction must exceed repro_041 by 0.001, improve both specimen scores, protect edge tails at -0.002 and division counts globally and per specimen. Separate from this contract-only gate.

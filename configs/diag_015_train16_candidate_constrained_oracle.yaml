schema_version: 1
experiment_id: diag_015_train16_candidate_constrained_oracle
parent: diag_014_train16_preilp_edge_export
hypothesis: Candidate-constrained oracle edits from cumulative families A, A+B, and A+B+C have positive combined-metric headroom on both specimens under the fixed 16-video validation protocol.
change:
  component: phase0_candidate_constrained_counterfactual_oracle
  from: complete label-free pre-ILP candidate evidence with no GT-informed headroom estimate
  to: CPU-only GT-informed atomic edit oracle constrained to the bounded diag_014 candidate export
  variables_changed: diagnostic_analysis_only

source_notebook: .private/current/phase0_candidate_oracle.ipynb

validation:
  protocol: public_0933_train16_candidate_oracle_v1
  primary_metric: minimum_specimen_abc_delta_score
  seed: public_0933_train16_v1
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: Train-derived proxy with frozen feature extractors; use paired deltas and cross-specimen consistency only.

budget:
  tier: 1
  expected_gpu_hours: 0.0

success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: oracle_gate_passed

admission:
  require_claude_review: true
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_notebook.py
    - "{source_notebook}"
    - --require-metrics-contract

kaggle:
  owner: lingxd
  slug: biohub-diag015-candidate-oracle
  title: biohub-diag015-candidate-oracle
  inject_experiment_id: false
  competition_sources: [biohub-cell-tracking-during-development]
  dataset_sources:
    - pilkwang/biohub-tracking-support-pack-50ep-v1
  required_dataset_sources: 1
  kernel_sources:
    - lingxd/biohub-diag014-preilp-edge-export
  extra_files:
    - scripts/run_phase0_candidate_oracle.py
  enable_gpu: false
  enable_internet: false
  is_private: true

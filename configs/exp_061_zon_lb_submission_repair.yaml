schema_version: 1
experiment_id: exp_061_zon_lb_submission_repair
parent: exp_061_deepcenter_tta
hypothesis: A full current-input exp061 zon inference notebook fixes the static-CSV
  code-submission failure without changing the inference strategy.
change:
  component: code_submission_adapter
  from: Static development CSV promotion and fixed development parity hash
  to: Full unchanged exp061 inference, original-XY current-input parity, fail-closed
    current-run zon publication
  variables_changed: Submission transport and input-relative validation only; no prediction
    policy edits
source_notebook: .private/exp061_lb_repair/build/exp061_zon_lb_repair.ipynb
substrate_note: 'Full re-run of the frozen repro_059 (0.947) notebook (same three
  Pilkwang checkpoints). The parent notebook is copied byte-for-byte; two cells are
  appended (exp061_deepcenter_tta.py source + a guarded top-level call) and four strippable
  `# exp061` lines are injected (a 2.0h watchdog, a veto-candidate stub, and gap1
  + safe-div call-site loggers). Stripping every `# exp061` line + the appended cells
  reproduces the parent notebook exactly (parity guard). ONE inference dominates;
  DeepCenter view forwards are computed once per (dataset,t,view) and reused across
  arms (~17 distinct forwards/frame union). Three CPU replays are cheap. The adaptive
  PP-sweep is the parent''s own byte-frozen path. Feasibility is CONDITIONAL on the
  build-time timing telemetry; arm admission is gated by measured running rate + a
  20-min finalization reserve; a partial run (e.g. xyd4 not started) is a valid recorded
  result. ~1.4-1.8 GPU hr provisional; 2.0 hr hard-stop reservation.

  '
validation:
  protocol: public_0947_deepcenter_tta_probe_v1
  primary_metric: binary_integrity_gate
  warning: 'Integrity gate only; decides NOTHING about quality. The controller checks:
    (a) build-time purely-additive parity guard (stripping the appended cells + `#
    exp061` lines reproduces the parent cells byte-for-byte); (b) runtime -- the xyonly
    arm submission SHA256 == d34533806b3153ddd4f33f3bbc1dea70af2d5406bb1ea48e42c135a97c213f60
    (parent 0.947), computed FRESH through the SAME cached accumulation path the experimental
    arms use; every started arm produced; resolved config pinned to MOTION_RELINK_TIGHT_UM=5.5;
    parent DeepCenter TTA env ON; each started experimental arm mechanism-active (heatmap
    differs from xyonly) or a recorded verified-null; finite telemetry; within the
    2.0h budget. The zon/xyd4 arms are scored by the Public LB in SEPARATE user-authorized
    submission steps; a tie at 0.947 is unresolved below displayed precision, not
    "no change"; conclusions are limited to the two interventions.

    '

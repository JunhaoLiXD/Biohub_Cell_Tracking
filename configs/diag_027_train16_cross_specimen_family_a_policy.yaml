schema_version: 1
experiment_id: diag_027_train16_cross_specimen_family_a_policy
parent: diag_026_train16_cross_specimen_feature_separability
hypothesis: A conservative Family-A action policy trained and calibrated on one specimen improves the frozen held-out score in both cross-specimen directions without reducing adjusted edge Jaccard.
change:
  component: phase1_family_a_action_policy_gate
  from: cross-specimen feature separability without metric-scored action selection
  to: bidirectional held-out evaluation of one highest-scoring orphan-only Family-A action per video above a train-specimen-calibrated threshold
  variables_changed: phase1_family_a_policy_diagnostic_only

source_notebook: .private/current/phase1_family_a_policy.ipynb

validation:
  protocol: public_0933_train16_cross_specimen_family_a_policy_v1
  primary_metric: minimum_heldout_delta_score
  seed: 314159
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: Train16 cross-specimen action-policy gate; thresholds are selected only on the training specimen and public leaderboard evidence is not used.

budget:
  tier: 1
  expected_gpu_hours: 0.0

success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: family_a_policy_gate_passed

admission:
  require_claude_review: false
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_phase1_policy_notebook.py
    - "{source_notebook}"

kaggle:
  owner: lingxd
  slug: biohub-diag027-family-a-policy
  title: biohub-diag027-family-a-policy
  inject_experiment_id: false
  competition_sources: [biohub-cell-tracking-during-development]
  dataset_sources:
    - pilkwang/biohub-tracking-support-pack-50ep-v1
  required_dataset_sources: 1
  kernel_sources:
    - lingxd/biohub-diag019-final-validation-graphs
  enable_gpu: false
  enable_internet: false
  is_private: true

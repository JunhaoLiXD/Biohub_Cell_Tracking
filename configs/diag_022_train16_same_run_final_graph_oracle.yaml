schema_version: 1
experiment_id: diag_022_train16_same_run_final_graph_oracle
parent: diag_019_train16_final_validation_graph_export
hypothesis: Candidate-constrained oracle edits from cumulative families A, A+B, and A+B+C have positive paired combined-metric headroom on both specimens when every candidate, source coordinate, and final graph comes from the same frozen diag_019 execution.
change:
  component: phase0_artifact_identity_guard
  from: candidate and pre-ILP artifacts from diag_014 mixed with final graphs from the independently executed diag_019
  to: candidate, pre-ILP, and final graph artifacts all loaded from the single diag_019 output root
  variables_changed: artifact_execution_identity_only
review_basis: experiments/diag_015_train16_candidate_constrained_oracle/review.md
failure_parent: diag_021_train16_final_graph_oracle_sourcecoords

source_notebook: .private/current/phase0_candidate_oracle.ipynb

validation:
  protocol: public_0933_train16_candidate_oracle_v1
  primary_metric: minimum_specimen_abc_delta_score
  seed: public_0933_train16_v1
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: Train-derived proxy with frozen feature extractors; use paired deltas and cross-specimen consistency only.

budget:
  tier: 1
  expected_gpu_hours: 0.0

success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: oracle_gate_passed

admission:

schema_version: 1
experiment_id: exp_010_train16_deepcenter_div_veto_guarded
parent: val_008_public_0933_train16_launchable
hypothesis: Enabling the already-loaded DeepCenter gate for safe-division additions will reduce false division edges on the fixed 16-video validator while retaining enough true divisions to improve the combined score on both specimens.
change:
  component: safe_division_confirmation
  from: geometric and motion constraints with DeepCenter safe-division veto disabled
  to: identical safe-division proposals confirmed by the frozen DeepCenter model at threshold 0.12
  variables_changed: deepcenter_safe_div_veto_only

source_notebook: .private/current/repro_public_0933.ipynb

validation:
  protocol: public_0933_embedded_train16_stratified_proxy_v1
  primary_metric: score
  seed: public_0933_train16_v1
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: The frozen feature extractors saw the training videos. Compare only paired deltas against val_008; this is not leaderboard or promotion evidence.

budget:
  tier: 1
  expected_gpu_hours: 2.0

success:
  minimum_improvement: 0.002
  regression_threshold: -0.002
  per_specimen_max_regression: 0.002

evaluation:
  mode: compare

admission:
  require_claude_review: false
  review_reference: experiments/exp_009_train16_deepcenter_div_veto/review.md
  review_scope_note: The referenced PASS review covers the complete single-variable experiment. This revision implements only its required guard, logging, checkpoint-comment, and diagnostic-counter changes.
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_notebook.py
    - "{source_notebook}"
    - --require-metrics-contract

kaggle:
  owner: lingxd
  slug: biohub-exp010-train16-deepcenter-div-veto
  title: biohub-exp010-train16-deepcenter-div-veto
  accelerator: NvidiaTeslaT4
  inject_experiment_id: true
  competition_sources: [biohub-cell-tracking-during-development]
  dataset_sources:
    - pilkwang/biohub-deepcenter-unet3d-center-prior-v1
    - pilkwang/biohub-temporal-unet3d-seed314159-v1
    - pilkwang/biohub-tracking-support-pack-50ep-v1
  required_dataset_sources: 3
  enable_gpu: true
  enable_internet: false
  is_private: true

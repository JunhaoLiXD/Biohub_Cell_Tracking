schema_version: 1
experiment_id: diag_029_train16_factorized_family_a_policy
parent: diag_028_train16_deployment_complete_family_a_policy
hypothesis: Factorizing the Family-A action score into endpoint-validity and conditional division probabilities produces positive held-out frozen-score deltas in both cross-specimen directions without adjusted-edge regression.
change:
  component: phase1_family_a_action_score
  from: direct classifier for an ultra-rare beneficial deployment action
  to: product of endpoint-validity probability and division-edge probability conditional on matched endpoints
  variables_changed: factorized_action_score_only

source_notebook: .private/current/phase1_factorized_policy.ipynb

validation:
  protocol: public_0933_train16_factorized_family_a_policy_v1
  primary_metric: minimum_heldout_delta_score
  seed: 314159
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: Train16 cross-specimen action-policy gate; ground-truth matching is used for labels and diagnostics only, never as a model feature.

budget:
  tier: 1
  expected_gpu_hours: 0.0

success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: factorized_policy_gate_passed

admission:
  require_claude_review: false
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_phase1_factorized_policy_notebook.py
    - "{source_notebook}"

kaggle:
  owner: lingxd
  slug: biohub-diag029-factorized-policy
  title: biohub-diag029-factorized-policy
  inject_experiment_id: false
  competition_sources: [biohub-cell-tracking-during-development]
  dataset_sources:
    - pilkwang/biohub-tracking-support-pack-50ep-v1
  required_dataset_sources: 1
  kernel_sources:
    - lingxd/biohub-diag019-final-validation-graphs
  enable_gpu: false
  enable_internet: false
  is_private: true

parent: repro_048_public_0946_exact_copy
hypothesis: >
  DIAGNOSTIC ONLY (A0 Parts 2-3), no quality hypothesis. On the exact 0.944 lineage
  (val_049 frozen GEFFs), export (P2) each safe_division candidate's stage-by-stage
  journey through the real 14-step gate + GT mapping, and (P3) a scorer-faithful
  characterization of predicted fork nodes + one-at-a-time official-score
  suppression/addition deltas, to determine WHERE division fails (candidate
  generation vs gating vs scoring) and whether any feature separates true from false
  divisions. Prediction-preserving; decides nothing about the leaderboard.
change:
  component: division_diagnostic_telemetry_only
  from: repro_048/val_049 postprocessing with no division-candidate telemetry
  to: >
    Side-effect-free instrumentation of add_safe_divisions_postlink and
    deepcenter_accept_repair_point that records per-candidate journey + geometry +
    DeepCenter score, plus a post-run GT-mapping / scorer-faithful fork audit /
    suppression-addition rescoring stage, in a FULL re-run of the val_049 train16
    pipeline (no GEFF reuse; user decision 2026-09-16).
  variables_changed: read_only_diagnostic_telemetry_only_no_prediction_path_change

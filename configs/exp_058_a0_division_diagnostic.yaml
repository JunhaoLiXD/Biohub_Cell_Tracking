  FULL RE-RUN (user decision 2026-09-16: no GEFF upload). The notebook is the
  val_049 train16 notebook run end-to-end (detector + association + postprocessing +
  scorer), ~1.3 GPU hr (budget expanded from 1.0 by user), with only additive
  diagnostic telemetry + a post-run analysis stage + the integrity block. No frozen
  GEFF dataset is created or uploaded.

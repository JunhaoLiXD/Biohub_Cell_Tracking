schema_version: 1
experiment_id: exp_061_zon_lb_submission_repair_v5
parent: exp_061_zon_lb_submission_repair_v4
hypothesis: 'The v4 hidden-rerun outcome is gated by deployment-scale limits, not
  by the zon prediction policy: a fixed 2.0h watchdog and a 4.48 GB view cache inside
  the collected output directory both fail on a sufficiently larger hidden dataset.
  Removing both limits without touching any predicted value lets the rerun finish.
  The exact v2/v4 hidden failure cause remains unproven.'
change:
  component: zon_only_submission_transport_v5
  from: 'v4: hardcoded signal.alarm(7200) and view cache under WORKING_DIR'
  to: rerun-aware deadline (2.0h visible / 8.5h hidden rerun) and view cache on a
    non-output scratch root
  variables_changed: deployment resource limits and cache location only; frozen zon
    prediction policy
source_notebook: .private/exp061_lb_repair_v5/build/exp061_zon_submission_repair_v5.ipynb
substrate_note: Unchanged v4 parent inference cells and frozen zon prediction/graph-writer
  policy. The only behavioral changes are the rerun-aware whole-run deadline and moving
  the view cache off the collected output path; both are resource-placement changes
  that cannot alter a predicted node or edge.
validation:
  protocol: exp061_zon_only_deployment_v5
  primary_metric: binary_integrity_gate
  warning: Deployment integrity only, not a quality metric. The v2 and v4 hidden tracebacks
    are unavailable, so the scale hypothesis is not proven. The watchdog still covers
    parent inference, zon replay, final audit, staging and publication. A separate
    authorization is required for any leaderboard submission.

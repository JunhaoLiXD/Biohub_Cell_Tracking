schema_version: 1
experiment_id: diag_020_train16_final_graph_candidate_oracle
parent: diag_019_train16_final_validation_graph_export
hypothesis: Candidate-constrained oracle edits from cumulative families A, A+B, and A+B+C have positive paired combined-metric headroom on both specimens when applied to the exact final graphs used by the frozen train16 validator.
change:
  component: phase0_candidate_constrained_counterfactual_oracle
  from: oracle applied to raw pre-postprocessing ILP graphs, which did not reproduce the frozen baseline
  to: identical candidate-constrained oracle applied to hash-verified post-filter graphs exported immediately before validator scoring
  variables_changed: oracle_graph_stage_only
review_basis: experiments/diag_015_train16_candidate_constrained_oracle/review.md
invalidated_predecessor: diag_018_train16_candidate_constrained_oracle_stageaware

source_notebook: .private/current/phase0_candidate_oracle.ipynb

validation:
  protocol: public_0933_train16_candidate_oracle_v1
  primary_metric: minimum_specimen_abc_delta_score
  seed: public_0933_train16_v1
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: Train-derived proxy with frozen feature extractors; use paired deltas and cross-specimen consistency only.

budget:
  tier: 1
  expected_gpu_hours: 0.0

success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: oracle_gate_passed

admission:
  require_claude_review: false
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_phase0_oracle_notebook.py
    - "{source_notebook}"


local:
  smoke_test:
    - "{python}"
    - scripts/validate_notebook.py
    - "{source_notebook}"
budget:
  tier: 1
  expected_gpu_hours: 2.0
  note: >
    Ceiling for the WHOLE of exp_063, not per run. The source claims 19 minutes; our comparable
    parent kernel measured 1.727 h, and the title claim is unverified, so 2.0 h is a deliberate
    upper bound rather than an estimate. Discretionary GPU is 10.872382 h after the protected
    6.0 h reserve.
success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
evaluation:
  mode: gate
  gate_field: exp063_repro_integrity_passed
gate: exp063_repro_integrity_passed
leaderboard:
  authorized: false
  plan: >
    Exactly ONE submission of this arm, separately authorized, remote cap checked first. Governing
    limit is the PROJECT rule of THREE per America/New_York day (AGENTS.md), stricter than the
    platform's 5. Comparator is max(0.947, exp_062 k2 = submission 56530197). Decision rule:
    ABOVE comparator -> adopt as the new parent; EQUAL -> no measurable difference at 3 decimals,
    which is NOT proof of identical predictions, stop the family; BELOW -> OUR frozen reproduction
    under OUR execution conditions underperformed, which says nothing about the author's own claim,
    revert to the incumbent and stop the family. BOUNDS: at most 2 exp_063 runs total (arm B
    biohub-sota-0-948-density-adaptive-2xt4-22m requires its own separate decision and is NOT
    pre-approved); at most ONE hidden-rerun retry, then the route is abandoned; NO open-ended
    tuning inside a winning pipeline -- that would be a separate proposal.

schema_version: 1
experiment_id: exp_043_public_0942_motion_ema_adaptive_reset
parent: repro_041_public_0941_motion_ema
hypothesis: >
  Retaining base EMA alpha 0.4 but resetting the update to alpha 1.0 only when the
  label-free normalized velocity innovation exceeds 1.0 will preserve or improve the
  frozen-train16 aggregate score, retain division counts, and improve the worst video-level
  adjusted-edge delta versus val_039 to at least -0.002.
change:
  component: motion_relink_velocity_estimator
  from: Fixed per-track EMA alpha 0.4 with velocity multiplier 0.5
  to: Label-free adaptive EMA with base alpha 0.4 and one-update alpha 1.0 reset when normalized velocity innovation exceeds 1.0; velocity multiplier remains 0.5
  variables_changed: motion_relink_adaptive_ema_reset_rule_only
source_notebook: .private/current/public_0942_motion_ema_adaptive_reset.ipynb
validation:
  protocol: public_0941_frozen_train16_stratified_proxy_v1
  primary_metric: score
  seed: public_0933_train16_v1
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  division_positive_target_per_specimen: 4
  sample_and_scorer_reference: val_039_public_0941_train16
  comparison_parent: repro_041_public_0941_motion_ema
  alpha04_primary_metric: 0.9387332376874039
  per_specimen_adjusted_edge_regression_tolerance: 0.001
  worst_video_delta_floor_vs_val039: -0.002
  division_count_gates: {minimum_tp: 4, maximum_fp: 8, maximum_fn: 8}
  adaptive_rule:
    signal: norm(current_step_velocity - prior_ema_velocity) / max(norm(current_step_velocity), norm(prior_ema_velocity), 1.0e-6)
    threshold: 1.0
    base_alpha: 0.4
    reset_alpha: 1.0
    data_dependencies: runtime_selected_positions_only
    prohibited_dependencies: [specimen_id, video_id, ground_truth]
  warning: Frozen models saw training videos; this is an optimistic paired adaptive-policy test, not held-out generalization.
budget:
  tier: 1
  expected_gpu_hours: 2.0
success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.001
evaluation:

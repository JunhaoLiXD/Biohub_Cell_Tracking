schema_version: 1
experiment_id: exp_046_public_0942_motion_ema_sparse_soft
parent: repro_041_public_0941_motion_ema
hypothesis: >
  Retaining fixed EMA alpha 0.4 for ordinary updates but using a mild alpha 0.6 for
  the approximately 1.18 percent of frozen-validation updates that simultaneously
  have normalized velocity innovation above 1.25, source track age at least 3, a
  finite second assignment candidate, and selected-assignment margin at least 0.5
  will improve the frozen-train16 score by at least 0.0001 without materially
  regressing either specimen, any individual video, or division counts.
change:
  component: motion_relink_velocity_estimator
  from: Fixed per-track EMA alpha 0.4 with velocity multiplier 0.5
  to: Label-free sparse soft EMA using alpha 0.6 only under the fixed innovation, age, finite-alternative, and assignment-margin guard; alpha 0.4 otherwise
  variables_changed: motion_relink_sparse_soft_ema_rule_only
source_notebook: .private/current/public_0942_motion_ema_sparse_soft.ipynb
validation:
  protocol: public_0941_frozen_train16_stratified_proxy_v1
  primary_metric: score
  seed: public_0933_train16_v1
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  division_positive_target_per_specimen: 4
  sample_and_scorer_reference: val_039_public_0941_train16
  comparison_parent: repro_041_public_0941_motion_ema
  parent_primary_metric: 0.9387332376874039
  minimum_improvement: 0.0001
  per_specimen_adjusted_edge_regression_tolerance: 0.001
  worst_video_delta_floor_vs_parent: -0.002
  division_count_gates: {minimum_tp: 4, maximum_fp: 8, maximum_fn: 8}
  adaptive_rule:
    signal: norm(current_step_velocity - prior_ema_velocity) / max(norm(current_step_velocity), norm(prior_ema_velocity), 1.0e-6)
    innovation_threshold: 1.25
    minimum_track_age: 3
    require_finite_second_candidate: true
    minimum_assignment_margin: 0.5
    base_alpha: 0.4
    soft_alpha: 0.6
    velocity_weight: 0.5
    data_dependencies: runtime_selected_positions_and_assignment_costs_only
    prohibited_dependencies: [specimen_id, video_id, ground_truth]
  execution_contract: Per-video soft update count must equal guarded_gt_1250 telemetry and soft plus base must equal eligible updates.
  warning: Frozen models saw training videos; this is an optimistic paired policy test, not held-out generalization.
budget:
  tier: 1
  expected_gpu_hours: 2.0
success:

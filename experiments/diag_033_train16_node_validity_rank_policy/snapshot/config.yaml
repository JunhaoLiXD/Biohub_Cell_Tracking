schema_version: 1
experiment_id: diag_033_train16_node_validity_rank_policy
parent: diag_032_train16_structural_rank_transfer_policy
hypothesis: Node-level endpoint-validity learning from all frozen prediction nodes supplies enough cross-specimen supervision for the structural rank-transfer Family-A policy to produce positive held-out frozen-score deltas in both directions without adjusted-edge regression.
change:
  component: phase1_endpoint_validity_unit
  from: sparse eligible-candidate-pair validity classification
  to: separate source-node and target-node validity probabilities learned from every frozen prediction node
  variables_changed: endpoint_validity_learning_unit_only

source_notebook: .private/current/phase1_node_validity_policy.ipynb

validation:
  protocol: public_0933_train16_node_validity_rank_policy_v1
  primary_metric: minimum_heldout_delta_score
  seed: 314159
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: Train16 cross-specimen action-policy gate; node matching is used for labels and diagnostics only, never as a model feature.

budget:
  tier: 1
  expected_gpu_hours: 0.0

success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: node_validity_policy_gate_passed

admission:
  require_claude_review: true
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_phase1_node_validity_notebook.py
    - "{source_notebook}"

kaggle:
  owner: lingxd
  slug: biohub-diag033-node-validity
  title: biohub-diag033-node-validity
  inject_experiment_id: false
  competition_sources: [biohub-cell-tracking-during-development]
  dataset_sources:
    - pilkwang/biohub-tracking-support-pack-50ep-v1
  required_dataset_sources: 1
  kernel_sources:
    - lingxd/biohub-diag019-final-validation-graphs
  enable_gpu: false
  enable_internet: false
  is_private: true

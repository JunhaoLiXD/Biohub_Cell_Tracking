schema_version: 1
experiment_id: exp_060_deepcenter_safe_div_threshold_sweep
parent: repro_059_public_0947_exact_copy
hypothesis: >
  The DeepCenter safe-division accept threshold (parent 0.20) is an LB-movable division lever.
  On the frozen 0.947 pipeline (repro_059, identical Pilkwang checkpoints), with the resolved
  post-processing config PINNED (base env + MOTION_RELINK_TIGHT_UM=5.5, adaptive PP-sweep NOT
  used for selection), produce three test submissions at DEEPCENTER_SAFE_DIV_THRESHOLD in
  {0.20 (byte-parity control), 0.18, 0.22} from one inference (shared heatmaps), and submit the
  two changed arms to the now-unlimited Public LB. Pre-registered arms; the LB decides. Division
  is the bottleneck (held-out 3/1/9; the 0.20 gate accepts 316 / rejects 414 candidates on the
  test movies, so 0.18/0.22 will materially move the accepted-division set).
change:
  component: deepcenter_safe_division_threshold_only
  from: repro_059 postprocessing with DEEPCENTER_SAFE_DIV_THRESHOLD fixed at 0.20 (single submission)
  to: >
    Purely-additive appended cells that re-run the UNCHANGED filter_output_graph per test movie
    at three safe-div thresholds sharing one persistent DeepCenter heatmap cache, writing three
    submissions + attribution telemetry (candidate identities/scores/accept + cross-arm
    fork/edge deltas) + a controller metrics.json gated on 0.20 byte-parity. The parent's own
    0.947 prediction path runs byte-unchanged (parity guard).
  variables_changed: deepcenter_safe_div_threshold_sweep_only_no_parent_path_change
source_notebook: .private/current/exp060_deepcenter_safe_div_threshold_sweep.ipynb
substrate_note: >
  Full re-run of the frozen repro_059 (0.947) notebook (same three Pilkwang checkpoints). The
  parent notebook is copied byte-for-byte; two cells are appended (exp060_threshold_sweep.py
  source + a guarded top-level call). Stripping the appended cells reproduces the parent
  notebook exactly. ONE inference dominates; three post-heatmap replays are cheap; heatmaps are
  computed once via a persistent cache. Estimated ~1.3-1.5 GPU hr; 2.0 hr hard-stop reservation.
validation:
  protocol: public_0947_deepcenter_safe_div_threshold_sweep_v1
  primary_metric: binary_integrity_gate
  warning: >
    Integrity gate only; decides NOTHING about quality. The controller checks: (a) build-time
    purely-additive parity guard (stripping the appended cells reproduces the parent cells
    byte-for-byte); (b) runtime exact reproduction -- the 0.20 arm submission SHA256 ==
    d34533806b3153ddd4f33f3bbc1dea70af2d5406bb1ea48e42c135a97c213f60 (parent 0.947), all three
    arms produced, resolved config pinned to MOTION_RELINK_TIGHT_UM=5.5, finite telemetry. The
    0.18/0.22 arms are scored by the Public LB in a SEPARATE user-authorized submission step; a
    tie at 0.947 is unresolved below displayed precision, not "no change".

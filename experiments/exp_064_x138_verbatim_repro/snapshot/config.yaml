schema_version: 1
experiment_id: exp_064_x138_verbatim_repro
parent: repro_059_public_0947_exact_copy
hypothesis: >
  A VERBATIM reproduction of anvithpothula/biohub-x138, run under our own account with the same
  four mounted datasets and the same pinned docker image, scores strictly above our incumbent
  comparator on the Public LB. Comparator is max(0.947, exp_062 k2 submission 56530197), resolved
  BEFORE any submission. The author is authenticated at rank 62 / 3888 with score 0.956 (full LB
  download 2026-09-24T20:03:35) and the notebook claims no score at all. That rank is evidence the
  AUTHOR is strong; per the admission review it establishes NO expected score for this
  reproduction, and in particular no floor of 0.947 -- this pipeline is not our parent and may
  score below it. Outcome is genuinely unknown until measured.
change:
  component: whole_pipeline_reproduction_no_authored_code
  from: repro_059 pipeline (our frozen 0.947 parent), rank ~478 / 3888
  to: >
    The third-party notebook byte-for-byte, ZERO code authored by us. Characterised at EXECUTION
    level (v1 of this config described it as "a coordinate head, orthogonal to our edge work"; the
    admission review showed that was both incomplete and overstated, and it is corrected here).
    The pipeline differs from our parent in MANY interacting ways, not one:
      * V1284 coordinate-refinement head -- frozen-feature coordinate regression at first-seen
        fused detections (module written at cell 4:511, called at patched predictor line 636,
        with `_v1284_index` also replacing `UNetNodeTransformer._index_features` at line 984).
        It changes BOTH node coordinates AND feature sampling, so it feeds association and graph
        geometry; it is NOT orthogonal to our previous edge-association work.
      * Neighborhood-flow relinking with a 7.0 um tight gate when a flow field exists, versus 5.5
        without one (cell 0:78-90, cell 5:687-715).
      * Re-admission of discarded detections followed by a further relink (cell 5:1249-1299,
        1943-1948).
      * Gap filling from sub-threshold peaks (cell 5:1181-1468, 1990+).
      * Continuous density-adaptive gap closing (cell 5:788-908).
      * Dual-seed detection fusion, frame-retention fallback, harmonic reverse association, and
        feature TTA for both models (cell 4:60-308).
    Final CSV coordinates are rounded at cell 5:2152-2154, AFTER association and repair.
  variables_changed: entire_pipeline_not_causally_isolated
source_notebook: docs/research/public_notebook_archive/biohub-x138.ipynb
substrate_note: >
  NOT causally isolated and not presented as one. If it beats the comparator we will not know which
  of the mechanisms above is responsible; with the competition closing 2026-09-29 that trade is
  accepted deliberately and explicitly by the user. Archived third-party artifact SHA256
  6b655e39bbfd2d3d6c762badea69847d3f00f5b548f385cb01b07ee2600fde6d, pulled 2026-09-24, committed
  in-repo because a sibling notebook the 09-23 recon quoted has already gone 403.
validation:
  protocol: x138_verbatim_repro_v1
  primary_metric: binary_integrity_gate
  warning: >
    No local proxy gate and no authored-code parity guard, because nothing is authored.
    Patch-parity and anchor-uniqueness tests are inapplicable to a verbatim copy. OUTPUT and
    EXECUTION validation are required instead and are IMPLEMENTED, not merely named, in
    scripts/collect_exp064_x138.py -- which emits the gate field. COMPLIANCE EVIDENCE CAVEAT,
    carried forward from three repeated review findings: the notebook's own
    `ground_truth_accessed: False` (cell 3:681) and its compliance fields (cell 6:131-134) are
    HARDCODED ASSERTIONS, not access telemetry, and its guard report carries stale effective-config
    values (cell 6:138-147). None of them may be cited as compliance evidence. The adapter reads
    the runtime receipt ONLY for checkpoint hashes, which are genuinely computed at runtime.
  known_unverified: >
    The V1284 checkpoint's state_dict/mean/scale compatibility could NOT be verified locally
    (no PyTorch in the dev venv) and loading is lazy, so "head patched" is not "head loaded". This
    is accepted as a RUN-TIME risk rather than a launch blocker, on the reviewer's explicit
    disposition that neither uncertainty alone should block a bounded reproduction and that the
    remote run may test compatibility. CORRECTION, required by admission round 3: the earlier claim
    that a mismatch "cannot silently produce a degraded submission" was TOO STRONG and is withdrawn.
    Strict state-dict matching and the displacement check catch gross failures, but they do NOT
    prove semantic compatibility -- incorrectly normalized features can still yield finite, bounded
    displacements and therefore a quietly worse submission. Training provenance likewise remains an
    unverified author claim, not a runtime-testable fact. Both are recorded as accepted research
    uncertainties, and the LB score is the only thing that would reveal a quiet degradation.
admission:
  require_codex_review: true
  reviewer_provider: codex
  note: >
    Direction authorized by the user 2026-09-24. exp_063 (haideptry family) is ABANDONED: that
    author appears nowhere in the 3888-row leaderboard and their flagship DivNet gate provably
    throws on every call. Round 1 on this experiment returned REVISE (not BLOCK) and confirmed the
    notebook itself is free of DivNet-style structural breakage; this config answers its required
    changes.

gate: x138_repro_integrity_passed
collection:
  adapter: scripts/collect_exp064_x138.py
  note: >
    The notebook emits no metrics.json and no gate field, so this adapter supplies both. It
    validates what the notebook's own guard (cell 6:10-94, cell 10:113-124) does NOT: unique
    (dataset,node_id) pairs, finite non-negative coordinates, integral ids/times on node rows
    (edge rows legitimately carry -1 sentinels), dynamic dataset discovery rather than an assumed
    four visible names, DeepCenter checkpoint identity, positive evidence that V1284 actually
    executed in candidate mode, absence of the five silent-degradation signatures Codex enumerated
    (low-detection dump skipped, re-admission swallowed, basic-filtered ILP fallback, repair
    deadline degradation, gap-filler idle), and inequality against BOTH known submission hashes.
    Negative-tested against the exp_062 k1 and k2 outputs: it correctly fails each as a duplicate
    and correctly reports V1284 absent.
leaderboard:
  authorized: false
  plan: >
    SUBMISSION COUNT, reconciled per the review: ONE initial submission of this arm, PLUS at most
    ONE further submission if and only if the first fails in the hidden rerun without producing a
    score (the exp_061 failure mode). Maximum two submissions total, never two scored probes.
    Each requires separate user authorization and a remote three-per-America/New_York-day check;
    1 of 3 was used on 2026-09-24 by exp_062 k2.
    PRECONDITIONS: the adapter gate passes, AND exp_062 k2's result is resolved so the comparator
    is known. Never submit an output that byte-matches d3453380 (parent) or ba9431c1 (k2).
    DECISION RULE: ABOVE comparator -> adopt as the new parent and continue the project on the x138
    route, as the user directed; EQUAL -> no measurable difference at 3 decimals, which is not
    proof of identical predictions; BELOW -> OUR reproduction under OUR conditions underperformed,
    which says nothing about the author's own 0.956. If the hidden rerun fails twice, the route is
    reconsidered rather than re-transported -- the exp_061 lesson was five failed transports.

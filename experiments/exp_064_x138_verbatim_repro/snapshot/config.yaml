budget:
  tier: 1
  expected_gpu_hours: 2.5
  note: >
    ACCOUNTING UNIT: charged GPU hours per launched kernel version, reconciled from CONFIRMED
    TERMINATION -- the kernel's own measured runtime at collection, never a nominal figure. There is
    no hard ceiling and none is claimed anywhere in this config.
    CUMULATIVE ALLOWANCE for exp_064: 4.0 h across all runs, against 10.872382 h discretionary
    (16.872382 total minus the protected 6.0 h). Our comparable parent kernel measured 1.727 h.
    RESERVATION: 2.5 h for the first run. This is an ATTENDED TARGET, not a bounded cost.
    ATTENDED WATCHDOG, armed at launch in the same action that pushes the kernel: it polls
    `kaggle kernels status lingxd/biohub-exp064-x138-repro` every 5 minutes, tolerates query
    failures and queued/initializing states without firing, distinguishes terminal states
    (COMPLETE / ERROR / CANCELLED) from RUNNING, and fires early at 2 h 15 m so polling and operator
    response have room inside the 2.5 h target. Arming is recorded in experiment.json; if the
    watchdog is not armed, the launch is not complete.
    HONEST LIMIT: Kaggle exposes no CLI cancel, so cancellation is performed by a human in the
    Kaggle UI. Operator response time is not bounded by anything technical, so the run CAN exceed
    2.5 h if the operator is away. That residual is explicitly accepted; it is an operational limit,
    not enforcement, and the 4.0 h cumulative allowance is consequently a budgeting intent rather
    than a guarantee.
    RETRY: a hidden-rerun failure costs no charged GPU on our side. Any further RUN requires a fresh
    reservation, is decided only after the first run's actual consumption is reconciled from
    confirmed termination, and is permitted only if the remaining allowance still covers it.
success:

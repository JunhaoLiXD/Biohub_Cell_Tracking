schema_version: 1
experiment_id: diag_028_train16_deployment_complete_family_a_policy
parent: diag_027_train16_cross_specimen_family_a_policy
hypothesis: Adding actual deployable Family-A candidates to the training negatives removes the matched-only distribution gap and yields positive held-out frozen-score deltas in both cross-specimen directions without adjusted-edge regression.
change:
  component: phase1_family_a_training_distribution
  from: matched-endpoint candidates only
  to: matched candidates union actual deployable Family-A candidates, with unmatched deployment candidates labeled negative
  variables_changed: deployment_complete_training_distribution_only

source_notebook: .private/current/phase1_deployment_policy.ipynb

validation:
  protocol: public_0933_train16_deployment_complete_family_a_policy_v1
  primary_metric: minimum_heldout_delta_score
  seed: 314159
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: Train16 cross-specimen action-policy gate; ground-truth matching is used for labels and diagnostics only, never as a model feature.

budget:
  tier: 1
  expected_gpu_hours: 0.0

success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: deployment_complete_policy_gate_passed

admission:
  require_claude_review: false
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_phase1_deployment_policy_notebook.py
    - "{source_notebook}"

kaggle:
  owner: lingxd
  slug: biohub-diag028-deployment-policy
  title: biohub-diag028-deployment-policy
  inject_experiment_id: false
  competition_sources: [biohub-cell-tracking-during-development]
  dataset_sources:
    - pilkwang/biohub-tracking-support-pack-50ep-v1
  required_dataset_sources: 1
  kernel_sources:

schema_version: 1
experiment_id: diag_012_train16_deepcenter_score_calibration
parent: val_008_public_0933_train16_launchable
hypothesis: Recording DeepCenter scores for every safe-division candidate while leaving the veto disabled will reproduce the fixed 16-video baseline exactly and reveal a calibrated score range for a later precision filter.
change:
  component: safe_division_diagnostics
  from: baseline safe-division output without candidate-level DeepCenter scores
  to: identical ungated output plus per-candidate DeepCenter scores and aggregate score quantiles
  variables_changed: diagnostic_instrumentation_only

source_notebook: .private/current/repro_public_0933.ipynb

validation:
  protocol: public_0933_embedded_train16_stratified_proxy_v1
  primary_metric: score
  seed: public_0933_train16_v1
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: This diagnostic must reproduce val_008 exactly; candidate scores are calibration evidence only and not leaderboard evidence.

budget:
  tier: 1
  expected_gpu_hours: 2.0

success:
  minimum_improvement: 0.0
  regression_threshold: -0.000000000001
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: calibration_passed

admission:
  require_claude_review: false
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_notebook.py
    - "{source_notebook}"
    - --require-metrics-contract

kaggle:
  owner: lingxd
  slug: biohub-diag012-deepcenter-score-calibration
  title: biohub-diag012-deepcenter-score-calibration
  accelerator: NvidiaTeslaT4
  inject_experiment_id: true
  competition_sources: [biohub-cell-tracking-during-development]
  dataset_sources:
    - pilkwang/biohub-deepcenter-unet3d-center-prior-v1
    - pilkwang/biohub-temporal-unet3d-seed314159-v1
    - pilkwang/biohub-tracking-support-pack-50ep-v1
  required_dataset_sources: 3
  enable_gpu: true
  enable_internet: false
  is_private: true

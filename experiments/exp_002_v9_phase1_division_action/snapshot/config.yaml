schema_version: 1
experiment_id: exp_002_v9_phase1_division_action
parent: baseline_public_0912
hypothesis: >
  A learned division-action scorer can replace geometric safe-divisions and increase the combined
  metric on both specimens without reducing adjusted edge Jaccard.
change:
  component: post_link_division_recovery
  from: geometric safe-divisions
  to: learned division-action scorer, family A first
  variables_changed: 1

source_notebook: src/v9_division_aware.ipynb

validation:
  protocol: v9_leave_one_specimen_out
  primary_metric: score
  seed: 42
  required_specimens: [44b6, 6bba]
  require_matching_protocol_with_parent: false
  protocol_change_reason: Phase 1 introduces leave-one-specimen-out validation required by the v9 plan.

budget:
  tier: 1
  expected_gpu_hours: 2.0

success:
  minimum_improvement: 0.002
  regression_threshold: -0.002
  per_specimen_max_regression: 0.0

evaluation:
  mode: compare

admission:
  require_claude_review: true
  methodology_valid: true
  require_reproducible_for_promotion: true

local:
  smoke_test:
    - "{python}"
    - scripts/validate_notebook.py
    - "{source_notebook}"
    - --require-metrics-contract

kaggle:
  owner: null
  owner_env: KAGGLE_USERNAME
  slug: biohub-v9-phase1-division-action
  title: Biohub v9 Phase 1 division action
  competition_sources: [biohub-cell-tracking-during-development]
  # Fill these with owner/dataset-slug references before launch. The notebook currently attaches
  # four private/public dataset versions by numeric Kaggle IDs, which kernel-metadata.json cannot
  # reproduce from IDs alone.
  dataset_sources: []
  required_dataset_sources: 4
  source_dataset_version_ids: [17751825, 17804310, 18187037, 18673646]
  enable_gpu: true
  enable_internet: true
  is_private: true


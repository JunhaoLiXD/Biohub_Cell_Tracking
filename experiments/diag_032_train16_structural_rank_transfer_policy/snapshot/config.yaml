schema_version: 1
experiment_id: diag_032_train16_structural_rank_transfer_policy
parent: diag_031_train16_structural_factorized_policy
hypothesis: Transferring the training-optimal number of highest-ranked structural Family-A actions avoids cross-specimen probability-scale mismatch and yields positive held-out frozen-score deltas in both directions without adjusted-edge regression.
change:
  component: phase1_family_a_cross_specimen_calibration
  from: absolute probability threshold transfer
  to: training-optimal global action-count transfer
  variables_changed: cross_specimen_calibration_only

source_notebook: .private/current/phase1_rank_transfer_policy.ipynb

validation:
  protocol: public_0933_train16_structural_rank_transfer_policy_v1
  primary_metric: minimum_heldout_delta_score
  seed: 314159
  required_specimens: [44b6, 6bba]
  samples_per_specimen: 8
  warning: Train16 cross-specimen action-policy gate; the action count is selected only on the training specimen.

budget:
  tier: 1
  expected_gpu_hours: 0.0

success:
  minimum_improvement: 0.0
  regression_threshold: 0.0
  per_specimen_max_regression: 0.0

evaluation:
  mode: gate
  gate_field: rank_transfer_policy_gate_passed

admission:
  require_claude_review: false
  methodology_valid: true
  require_reproducible_for_promotion: false

local:
  smoke_test:
    - "{python}"
    - scripts/validate_phase1_rank_transfer_notebook.py
    - "{source_notebook}"

kaggle:
  owner: lingxd
  slug: biohub-diag032-rank-transfer
  title: biohub-diag032-rank-transfer
  inject_experiment_id: false
  competition_sources: [biohub-cell-tracking-during-development]
  dataset_sources:
    - pilkwang/biohub-tracking-support-pack-50ep-v1
  required_dataset_sources: 1
  kernel_sources:
    - lingxd/biohub-diag019-final-validation-graphs
  enable_gpu: false
  enable_internet: false
  is_private: true

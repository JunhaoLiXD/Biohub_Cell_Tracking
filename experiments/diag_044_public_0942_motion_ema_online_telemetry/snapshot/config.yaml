schema_version: 1
experiment_id: diag_044_public_0942_motion_ema_online_telemetry
parent: repro_041_public_0941_motion_ema
hypothesis: >
  Adding read-only online motion telemetry to the exactly reproduced fixed-alpha-0.4
  parent will preserve its test submission bytes and frozen-train16 metrics exactly
  while measuring per-video innovation, track-age, assignment-margin, and prospective
  sparse-gate rates needed to design a bounded label-free soft EMA update.
change:
  component: motion_relink_observability
  from: Fixed per-track EMA alpha 0.4 without online decision telemetry
  to: Identical fixed per-track EMA alpha 0.4 with read-only online telemetry summaries
  variables_changed: instrumentation_only_no_prediction_change
